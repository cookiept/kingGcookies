<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Rei Recheado · Cookie's do King G</title>
  <meta name="description" content="Massa de chocolate com coração de mousse de chocolate. Receita para 6 cookies, passo a passo.">
  <meta property="og:title" content="O Rei Recheado · Cookie's do King G">
  <meta property="og:description" content="Massa de chocolate com coração de mousse de chocolate">
  <meta property="og:image" content="assets/img/cookies/recheada.png">
  <meta name="theme-color" content="#f3e3d6">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/king-head.png">
  <link rel="preload" href="assets/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fontes.css">
  <link rel="stylesheet" href="css/estilo.css">
  <script>try{if(sessionStorage.getItem("kingg:cortina"))document.documentElement.classList.add("cortina-pre")}catch(e){}</script>
</head>
<body data-pagina="receita" data-receita="recheada" style="--cor:#5a2d1a;--suave:#f3e3d6">

  <a class="saltar" href="#passos">Saltar para o passo a passo</a>

  <header class="nav">
    <a class="nav__marca" href="index.html" aria-label="Cookie's do King G, início">
      <img src="assets/img/king-head.png" alt="" width="44" height="44">
      <span>Cookie's do King <em class="g">G</em></span>
    </a>
    <button class="nav__menu" aria-expanded="false" aria-controls="nav-links" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav__links" id="nav-links" aria-label="Principal">
      <a href="index.html#joias" data-voltar>Todas as cookies</a>
      <a href="#ingredientes">Ingredientes</a>
      <a href="#passos">Passo a passo</a>
      <a href="livro.html">Livro PDF</a>
    </nav>
    <button class="btn btn--real btn--peq nav__cozinha" data-acao="cozinhar">Modo cozinha</button>
  </header>

  <main id="receita" class="pagina-receita"></main>

  <footer class="rodape">
    <svg class="onda onda--rodape" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70c180-60 360-60 540-10s360 70 540 20 270-70 360-40V120H0Z"/></svg>
    <div class="rodape__dentro">
      <div class="contentor rodape__grelha">
        <img src="assets/img/king-head.png" alt="" width="96" height="96">
        <div>
          <p class="rodape__marca">Cookie's do King <em class="g">G</em></p>
          <p class="script script--claro">Feito com manteiga a mais e zero vergonha.</p>
        </div>
        <a class="btn btn--claro" href="index.html#joias" data-voltar>Ver todas as cookies</a>
      </div>
    </div>
  </footer>

  <!-- barra fixa no telemóvel -->
  <div class="barra-movel">
    <a class="barra-movel__link" href="#ingredientes">Ingredientes</a>
    <a class="barra-movel__link" href="#passos">Passos</a>
    <button class="btn btn--real" data-acao="cozinhar">Modo cozinha</button>
  </div>

  <!-- modo cozinha -->
  <div class="cozinha" id="cozinha" role="dialog" aria-modal="true" aria-labelledby="cozinha-titulo" hidden>
    <div class="cozinha__topo">
      <div class="cozinha__receita">
        <img src="assets/img/cookies/recheada.png" alt="">
        <span>O Rei Recheado</span>
      </div>
      <button class="cozinha__fechar" id="cozinha-fechar" aria-label="Fechar modo cozinha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="cozinha__barra"><span id="cozinha-progresso"></span></div>
    <div class="cozinha__palco" id="cozinha-palco"></div>
    <div class="cozinha__nav">
      <button class="btn btn--contorno" id="cozinha-ant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Anterior
      </button>
      <button class="btn btn--real" id="cozinha-seg">Próximo</button>
    </div>
  </div>

  <div class="doca" id="doca" aria-live="polite"></div>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="js/receitas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
