<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livro de receitas · Cookie's do King G</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/fontes.css">
  <style>
    :root {
      --creme: #fbf6ee; --papel: #fff; --chocolate: #3b1d10; --chocolate-2: #5a3221;
      --capa: #c8102e; --mel: #ffc400; --laranja: #ed7328; --areia: #ecdcc2;
      --tinta: #2b170d; --tinta-suave: #6b5144;
    }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d9cbb6; }
    body { font: 400 10pt/1.5 "DM Sans", system-ui, sans-serif; color: var(--tinta); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pagina {
      width: 210mm; height: 297mm; margin: 10mm auto; background: var(--creme);
      position: relative; overflow: hidden; padding: 15mm 15mm 16mm;
      break-after: page; box-shadow: 0 10px 40px rgba(59, 29, 16, .2);
    }
    .rotulo { font: 600 7.5pt/1.4 "Jost", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--capa); margin: 0; }
    .script { font: 700 17pt/1.15 "Caveat", cursive; color: var(--chocolate-2); margin: 0; }
    .titulo { font: 400 38pt/.95 "Bebas Neue", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0; color: var(--chocolate); }
    .sub { font: 400 16pt/1 "Bebas Neue"; letter-spacing: .06em; text-transform: uppercase; color: var(--chocolate); margin: 0 0 2.5mm; }
    .blob { position: absolute; z-index: 0; }
    .rodape-p { position: absolute; left: 15mm; right: 15mm; bottom: 8mm; display: flex; justify-content: space-between; font: 600 6.8pt/1 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--tinta-suave); }
    .g { font-style: normal; display: inline-block; color: var(--mel); -webkit-text-stroke: .045em var(--chocolate); paint-order: stroke fill; text-shadow: .05em .06em 0 var(--chocolate); transform: rotate(-8deg) scale(1.18); margin-left: .06em; }

    /* coroa por cima do G */
    .g { position: relative; }
    .g::before {
      content: ""; position: absolute; left: 50%; top: -.4em;
      width: .78em; height: .46em; translate: -50% 0; rotate: 4deg;
  background: url("assets/img/coroa.png") no-repeat center / contain;
  filter: drop-shadow(0 .03em .03em rgba(59, 29, 16, .35));
      -webkit-text-stroke: 0; pointer-events: none;
    }
    .chip { display: inline-block; background: var(--papel); border-radius: 4mm; padding: 1.4mm 3mm; font: 600 6.8pt/1 "Jost"; letter-spacing: .12em; text-transform: uppercase; color: var(--chocolate); }
    .nivel i { display: inline-block; width: 1.4mm; border-radius: .4mm; background: var(--areia); margin-right: .6mm; vertical-align: bottom; }
    .nivel i:nth-child(1) { height: 1.5mm; } .nivel i:nth-child(2) { height: 2.4mm; } .nivel i:nth-child(3) { height: 3.3mm; }
    .nivel i.on { background: var(--cor, var(--capa)); }

    /* capa */
    .capa .blob { width: 175mm; right: -40mm; top: 40mm; fill: var(--mel); }
    .capa .blob2 { width: 120mm; left: -45mm; top: auto; bottom: -55mm; fill: var(--laranja); }
    .capa__titulo { position: relative; z-index: 1; font: 400 64pt/.98 "Luckiest Guy", sans-serif; color: var(--chocolate); text-transform: uppercase; margin: 6mm 0 0; }
    .capa__titulo span { display: block; }
    .capa__titulo .do { font: 700 34pt/.8 "Caveat", cursive; color: var(--chocolate-2); text-transform: none; margin: 0 0 0 3mm; }
    .capa__titulo .rei { color: var(--capa); text-shadow: 2.5pt 3pt 0 rgba(255, 196, 0, .9); }
    .capa__rei { position: absolute; z-index: 1; width: 158mm; right: -6mm; top: 96mm; filter: drop-shadow(0 6mm 5mm rgba(59, 29, 16, .25)); }
    .capa__lema { position: relative; z-index: 1; margin-top: 6mm; font-size: 22pt; }
    .capa__trio { position: absolute; z-index: 2; left: 15mm; bottom: 24mm; display: flex; gap: 3mm; align-items: flex-end; }
    .capa__trio img { width: 30mm; filter: drop-shadow(0 3mm 3mm rgba(59, 29, 16, .3)); }
    .capa__trio img:nth-child(2) { width: 36mm; }
    .capa__sub { position: absolute; z-index: 2; right: 15mm; bottom: 12mm; color: var(--chocolate); font: 600 8pt/1 "Jost"; letter-spacing: .2em; text-transform: uppercase; }

    /* índice */
    .indice__lista { margin-top: 8mm; display: grid; gap: 5mm; }
    .indice__item { display: grid; grid-template-columns: 40mm 1fr; gap: 6mm; align-items: center; background: var(--papel); border-radius: 5mm; padding: 5mm; box-shadow: -4mm 3mm 12mm rgba(59, 29, 16, .1); }
    .indice__item img { width: 38mm; filter: drop-shadow(0 3mm 3mm rgba(59, 29, 16, .25)); }
    .indice__item h3 { font: 400 26pt/1 "Bebas Neue"; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 1mm; color: var(--cor); }
    .indice__item p { margin: 0 0 2mm; color: var(--tinta-suave); }
    .chips { display: flex; flex-wrap: wrap; gap: 2mm; }
    .indice__item .chip { background: var(--creme); }
    .indice__como { margin-top: 8mm; background: var(--papel); border-radius: 5mm; padding: 5mm 6mm; }
    .indice__como ol { margin: 0; padding-left: 5mm; display: grid; gap: 1.5mm; }

    /* receita: página 1 */
    .rec { background: var(--suave); }
    .rec .blob { width: 120mm; right: -36mm; top: -34mm; fill: var(--papel); opacity: .6; }
    .rec__cabeca { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 60mm; gap: 6mm; align-items: center; }
    .rec__cabeca img { width: 60mm; filter: drop-shadow(0 4mm 4mm rgba(59, 29, 16, .3)); }
    .rec__nome { font: 400 34pt/.95 "Bebas Neue"; letter-spacing: .03em; text-transform: uppercase; color: var(--cor); margin: 1.5mm 0 1.5mm; }
    .rec__subt { margin: 0 0 4mm; font-size: 11.5pt; }
    .factos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm; margin: 0; }
    .factos div { background: var(--papel); border-radius: 2.5mm; padding: 2mm 2.6mm; }
    .factos dt { font: 600 5.8pt/1.4 "Jost"; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-suave); }
    .factos dd { margin: .4mm 0 0; font-weight: 700; color: var(--chocolate); font-size: 8.4pt; line-height: 1.25; }
    .rec__meio { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin-top: 5mm; }
    .bloco { background: var(--papel); border-radius: 4mm; padding: 4mm 5mm; }
    .bloco ul.antes { margin: 0; padding-left: 4mm; font-size: 8.4pt; line-height: 1.4; display: grid; gap: 1mm; }
    .equip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.6mm 1mm; }
    .equip figure { margin: 0; text-align: center; }
    .equip img { width: 10mm; height: 10mm; object-fit: contain; margin: 0 auto .6mm; }
    .equip figcaption { font: 600 5.6pt/1.2 "Jost"; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
    .ing { position: relative; z-index: 1; margin-top: 4mm; background: var(--papel); border-radius: 4mm; padding: 4mm 5mm; }
    .ing__cols { columns: 2; column-gap: 7mm; }
    .ing__grupo { break-inside: avoid; margin-bottom: 2mm; }
    .ing__grupo h4 { font: 700 13pt/1 "Caveat"; color: var(--cor); margin: 1mm 0 .8mm; }
    .ing__grupo ul { list-style: none; margin: 0; padding: 0; }
    .ing__grupo li { display: grid; grid-template-columns: 3.4mm 11mm 1fr 19mm; gap: 1.5mm; padding: 1.2mm 0; border-bottom: .3mm dashed var(--areia); font-size: 8.4pt; line-height: 1.28; break-inside: avoid; }
    .ing__grupo li:last-child { border: 0; }
    .ing__grupo li::before { content: ""; width: 3mm; height: 3mm; border: .4mm solid var(--areia); border-radius: 1mm; margin-top: .2mm; }
    .ing__grupo b { color: var(--chocolate); }
    .ing__grupo i { font-style: normal; color: var(--tinta-suave); font-size: 7.6pt; text-align: right; }
    .notas { position: relative; z-index: 1; margin-top: 4mm; background: var(--chocolate); color: #f7e8d6; border-radius: 4mm; padding: 3.5mm 5mm; font-size: 8.4pt; }
    .notas strong { font: 700 13pt/1 "Caveat"; color: var(--mel); display: block; margin-bottom: 1mm; }
    .notas ul { margin: 0; padding-left: 4mm; display: grid; gap: .8mm; }

    /* receita: página 2 (passos) */
    .pas__cabeca { position: relative; z-index: 1; display: flex; align-items: center; gap: 4mm; margin-bottom: 4mm; }
    .pas__cabeca img { width: 18mm; filter: drop-shadow(0 2mm 2mm rgba(59, 29, 16, .25)); }
    .pas__cabeca h2 { font: 400 30pt/.9 "Bebas Neue"; letter-spacing: .04em; text-transform: uppercase; color: var(--cor); margin: 0; }
    .pas { position: relative; z-index: 1; list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 4mm; }
    .pas li { break-inside: avoid; display: grid; grid-template-columns: 9mm 1fr; gap: 2.4mm; background: var(--papel); border-radius: 3mm; padding: 2.4mm 2.8mm; margin-bottom: 2.6mm; font-size: 8.1pt; line-height: 1.36; }
    .pas__ic { position: relative; }
    .pas__ic img { width: 9mm; height: 9mm; object-fit: contain; }
    .pas__n { position: absolute; top: -1.6mm; left: -1.6mm; width: 4.6mm; height: 4.6mm; border-radius: 50%; background: var(--cor); color: #fff; font: 400 8pt/4.6mm "Bebas Neue"; text-align: center; }
    .pas h4 { font: 400 11pt/1.05 "Bebas Neue"; letter-spacing: .05em; text-transform: uppercase; margin: .4mm 0 .6mm; color: var(--chocolate); }
    .pas h4 small { font: 600 6.3pt/1 "Jost"; letter-spacing: .1em; color: var(--cor); margin-left: 1.4mm; white-space: nowrap; }
    .pas p { margin: 0; }

    /* final */
    .regras { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin: 6mm 0 8mm; }
    .regra { background: var(--papel); border-radius: 4mm; padding: 4mm; display: grid; grid-template-columns: 15mm 1fr; gap: 3mm; align-items: start; }
    .regra img { width: 15mm; height: 15mm; object-fit: contain; }
    .regra h3 { font: 400 14pt/1 "Bebas Neue"; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 1mm; }
    .regra p { margin: 0; font-size: 8.4pt; color: var(--tinta-suave); line-height: 1.4; }
    .compras { background: var(--papel); border-radius: 4mm; padding: 3mm 6mm; columns: 2; column-gap: 8mm; margin-top: 3mm; }
    .compras div { break-inside: avoid; display: grid; grid-template-columns: 3.4mm 18mm 1fr; gap: 1.5mm; padding: 1.2mm 0; border-bottom: .3mm dashed var(--areia); font-size: 8.4pt; }
    .compras div::before { content: ""; width: 3mm; height: 3mm; border: .4mm solid var(--areia); border-radius: 1mm; margin-top: .5mm; }
    .final__rei { position: absolute; right: 10mm; bottom: 12mm; width: 60mm; }
    .final__adeus { position: absolute; left: 15mm; bottom: 24mm; font-size: 24pt; color: var(--capa); max-width: 105mm; }

    .barra { position: sticky; top: 0; z-index: 9; display: flex; justify-content: center; gap: 10px; padding: 10px; background: var(--chocolate); flex-wrap: wrap; }
    .barra a, .barra button { font: 600 12px/1 "Jost"; letter-spacing: .14em; text-transform: uppercase; border: 0; border-radius: 30px; padding: 14px 22px; cursor: pointer; text-decoration: none; }
    .barra button { background: var(--capa); color: #fff; }
    .barra a { background: #fff; color: var(--chocolate); }
    @media screen and (max-width: 820px) { #livro { zoom: .45; } }
    @media print { html, body { background: none; } .pagina { margin: 0; box-shadow: none; } .barra { display: none !important; } #livro { zoom: 1; } }
  </style>
</head>
<body>
  <div class="barra">
    <a href="index.html">← Voltar ao site</a>
    <a href="docs/Livro-Cookies-do-King-G.pdf" download>Descarregar PDF</a>
    <button onclick="window.print()">Imprimir</button>
  </div>
  <div id="livro"></div>

  <script src="js/receitas.js"></script>
  <script>
  (() => {
    const ICON = n => `assets/img/icons/${n}.png`;
    const BLOB = '<path d="M421 72c62 38 118 102 128 176 10 75-26 160-86 218-60 57-145 87-226 72-82-15-160-75-185-153C27 307 55 212 116 146 177 80 272 43 339 44c30 1 57 11 82 28Z"/>';
    const FR = { .25: "¼", .5: "½", .75: "¾" };
    const frac = x => { const r = Math.round(x * 4) / 4, i = Math.floor(r), d = +(r - i).toFixed(2); return (i || "") + (FR[d] || ""); };
    const qt = it => it.qtd || (Math.round(it.q) + (it.u === "ml" ? " ml" : " g"));
    const nome = it => it.n;
    const txt = t => t.replace(/\{N\}/g, BASE_COOKIES);
    const nivel = n => `<span class="nivel">${[1, 2, 3].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span> ${NIVEIS[n]}`;
    const rodape = n => `<div class="rodape-p"><span>Cookie's do King G</span><span>${n}</span></div>`;
    let pag = 1;

    let html = `
      <section class="pagina capa">
        <svg class="blob" viewBox="0 0 600 600">${BLOB}</svg>
        <svg class="blob blob2" viewBox="0 0 600 600">${BLOB}</svg>
        <p class="rotulo" style="position:relative;z-index:1">Livro de receitas</p>
        <h1 class="capa__titulo"><span>Cookie's</span><span class="do">do</span><span class="rei">King <em class="g">G</em></span></h1>
        <p class="script capa__lema">Sua Majestade decretou:<br>cookies para todos.</p>
        <img class="capa__rei" src="assets/img/king-g.png" alt="">
        <div class="capa__trio">${RECEITAS.map(r => `<img src="${r.imagem}" alt="">`).join("")}</div>
        <p class="capa__sub">3 receitas · ${BASE_COOKIES} cookies cada</p>
      </section>`;
    pag++;

    html += `
      <section class="pagina indice">
        <p class="rotulo">Índice</p>
        <h2 class="titulo">As receitas</h2>
        <div class="indice__lista">
          ${RECEITAS.map((r, i) => `
            <article class="indice__item" style="--cor:${r.cor}">
              <img src="${r.imagem}" alt="">
              <div>
                <p class="rotulo" style="color:${r.cor}">Páginas ${3 + i * 2}–${4 + i * 2}</p>
                <h3>${r.nome}</h3>
                <p>${r.descricao}</p>
                <div class="chips"><span class="chip">${r.tempoTotal}</span><span class="chip">${r.forno}</span><span class="chip">${nivel(r.nivel)}</span></div>
              </div>
            </article>`).join("")}
        </div>
        <div class="indice__como">
          <p class="sub">Como usar este livro</p>
          <ol>
            <li>Lê a receita inteira antes de começar, incluindo os tempos de frigorífico e congelador.</li>
            <li>Pesa todos os ingredientes antes de ligar a batedeira.</li>
            <li>As quantidades são para ${BASE_COOKIES} cookies grandes. Para outras doses, usa o site: ele recalcula tudo.</li>
          </ol>
        </div>
        ${rodape(pag++)}
      </section>`;

    RECEITAS.forEach((r, i) => {
      html += `
      <section class="pagina rec" style="--cor:${r.cor};--suave:${r.corSuave}">
        <svg class="blob" viewBox="0 0 600 600">${BLOB}</svg>
        <header class="rec__cabeca">
          <div>
            <p class="rotulo" style="color:${r.cor}">Receita ${i + 1} de ${RECEITAS.length}</p>
            <h2 class="rec__nome">${r.nome}</h2>
            <p class="rec__subt">${r.subtitulo}</p>
            <dl class="factos">
              <div><dt>Rende</dt><dd>${BASE_COOKIES} cookies</dd></div>
              <div><dt>Mãos na massa</dt><dd>${r.tempoAtivo}</dd></div>
              <div><dt>Tempo total</dt><dd>${r.tempoTotal}</dd></div>
              <div><dt>Forno</dt><dd>${r.forno}</dd></div>
              <div><dt>Cada cookie</dt><dd>${r.pesoBola}</dd></div>
              <div><dt>Nível</dt><dd>${nivel(r.nivel)}</dd></div>
            </dl>
          </div>
          <img src="${r.imagem}" alt="">
        </header>
        <div class="rec__meio">
          <div class="bloco">
            <p class="sub">Antes de começar</p>
            <ul class="antes">${r.preparacao.map(p => `<li>${p}</li>`).join("")}</ul>
          </div>
          <div class="bloco">
            <p class="sub">Vais precisar de</p>
            <div class="equip">${r.equipamento.map(e => `<figure><img src="${ICON(e)}" alt=""><figcaption>${EQUIPAMENTO[e]}</figcaption></figure>`).join("")}</div>
          </div>
        </div>
        <div class="ing">
          <p class="sub">Ingredientes <span style="font:600 6.5pt Jost;letter-spacing:.12em;color:var(--tinta-suave);margin-left:2mm">GRAMAS · CHÁVENAS E COLHERES (240 / 15 / 5 ML)</span></p>
          <div class="ing__cols">
            ${r.grupos.map(g => `<div class="ing__grupo"><h4>${g.titulo}</h4><ul>${g.itens.map(it => { const v = emVolume(it, 1); return `<li><b>${qt(it)}</b><span>${nome(it)}</span><i>${v ? v.q : ""}</i></li>`; }).join("")}</ul></div>`).join("")}
          </div>
        </div>
        <div class="notas"><strong>Notas</strong><ul>${r.dicas.map(d => `<li>${d}</li>`).join("")}</ul></div>
        ${rodape(pag++)}
      </section>

      <section class="pagina rec" style="--cor:${r.cor};--suave:${r.corSuave}">
        <svg class="blob" viewBox="0 0 600 600">${BLOB}</svg>
        <div class="pas__cabeca">
          <img src="${r.imagem}" alt="">
          <div><p class="rotulo" style="color:${r.cor}">${r.nome}</p><h2>Passo a passo</h2></div>
        </div>
        <ol class="pas">${r.passos.map((p, j) => `
          <li>
            <div class="pas__ic"><img src="${ICON(p.icone)}" alt=""><span class="pas__n">${j + 1}</span></div>
            <div><h4>${p.t}${p.min ? `<small>${p.min} min</small>` : ""}</h4><p>${txt(p.d)}</p></div>
          </li>`).join("")}
        </ol>
        ${rodape(pag++)}
      </section>`;
    });

    const curto = t => t && t.split(/[(,]/)[0].trim();
    const mapa = new Map();
    RECEITAS.forEach(r => r.grupos.forEach(g => g.itens.forEach(it => {
      const k = (it.loja ? it.loja.n : curto(it.n)).toLowerCase();
      const a = mapa.get(k) || { q: 0, n: curto(it.n), loja: it.loja, u: it.u };
      a.q += it.q; mapa.set(k, a);
    })));
    const lista = [...mapa.values()].map(it => {
      if (!it.loja) return it;
      const n = Math.max(1, Math.ceil(it.q / it.loja.por - 0.001));
      return { q: it.q, qtd: String(n), n: n > 1 ? it.loja.plural : it.loja.n };
    }).sort((a, b) => b.q - a.q);

    html += `
      <section class="pagina final">
        <p class="rotulo">Para as três receitas</p>
        <h2 class="titulo">As quatro regras do Rei</h2>
        <div class="regras">
          ${REGRAS_DO_REINO.map(g => `<div class="regra"><img src="${ICON(g.icone)}" alt=""><div><h3>${g.t}</h3><p>${g.d}</p></div></div>`).join("")}
        </div>
        <p class="rotulo">Lista de compras</p>
        <h2 class="titulo" style="font-size:28pt">As três receitas (${BASE_COOKIES * RECEITAS.length} cookies)</h2>
        <div class="compras">${lista.map(it => `<div><b>${qt(it)}</b><span>${nome(it)}</span></div>`).join("")}</div>
        <p class="script final__adeus">Agora vai. O forno não se pré-aquece sozinho.</p>
        <img class="final__rei" src="assets/img/king-g.png" alt="">
        ${rodape(pag++)}
      </section>`;

    document.getElementById("livro").innerHTML = html;
  })();
  </script>
</body>
</html>
